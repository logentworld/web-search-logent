name: 플러그인 검증과 릴리스
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.LOGENT_PLUGIN_API_TOKEN || github.token }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Android SDK를 설치해요
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: JVM 단위 테스트와 lint를 검증해요
        run: ./scripts/test.sh
      - name: 테스트용 키로 서명된 .lpg를 만들어요
        run: |
          key="$RUNNER_TEMP/logent-plugin-test.pem"
          public="$RUNNER_TEMP/logent-plugin-test-public.der"
          trap 'rm -f "$key" "$public"' EXIT
          umask 077
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -pkeyopt ec_param_enc:named_curve -out "$key"
          openssl ec -in "$key" -pubout -outform DER -conv_form uncompressed \
            -param_enc named_curve -out "$public" 2>/dev/null
          LOGENT_PLUGIN_SIGNING_KEY_FILE="$key" \
            LOGENT_PLUGIN_PUBLIC_KEY_FILE="$public" ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: plugin-verification
          path: |
            build/dist/
            plugin/build/reports/
            plugin/build/test-results/
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.LOGENT_PLUGIN_API_TOKEN || github.token }}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v3
      - name: Android SDK를 설치해요
        run: sdkmanager 'platforms;android-37' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: 신뢰 키로 .lpg를 서명해요
        env:
          CONTENT_PRIVATE_KEY: ${{ secrets.LOGENT_CONTENT_SIGNING_KEY }}
        run: |
          test -n "$CONTENT_PRIVATE_KEY" || { echo 'LOGENT_CONTENT_SIGNING_KEY 비밀을 설정해 주세요.' >&2; exit 1; }
          key="$RUNNER_TEMP/logent-content.pem"
          trap 'rm -f "$key"' EXIT
          umask 077
          printf '%s\n' "$CONTENT_PRIVATE_KEY" > "$key"
          LOGENT_CONTENT_SIGNING_KEY_FILE="$key" ./scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-release
          path: build/dist/
          if-no-files-found: error
